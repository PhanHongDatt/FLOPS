gates:
  G0:
    name: Evidence/source registry ready
    status: passed
    passed_date: "2026-08-07"
    notes: >
      8 entries verified from authoritative sources (proceedings pages + arXiv abstract pages):
      FedAvg, FedProx, SCAFFOLD, FedNova, Flower, Zhao2018-NonIID, YOLOv8, BDD100K.
      All author lists, venues, arXiv IDs confirmed. No entries from blogs or generated summaries.
      Next: pin environment versions (G1) — requires ADR-001.

  G1:
    name: Environment reproducible
    status: passed
    passed_date: "2026-10-03"
    notes: >
      Kaggle kernel phdatt/flops-s1-smoke-g1 v6 (commit e0b46f81, GPU T4 x2): pinned stack
      installs and imports — torch 2.7.1+cu128, torchvision 0.22.1 (ADR-002-A2),
      ultralytics 8.3.253, flwr 1.21.0, mlflow 2.22.5, protobuf 4.25.9, numpy 2.0.2,
      Python 3.12.13. environment.lock = pip freeze of that session (942 entries).
      Smoke FL (4 x 250 images, 2 rounds) ran end to end with all §21 artifacts, but
      learned weights did not change (≈3 accumulated optimizer steps/round with nbs 64);
      smoke now uses nbs = batch and fails if conv weights do not move. Smoke results
      are correctness checks only (CLAUDE.md §14), not experiments.

  G2:
    name: Centralized YOLOv8 baseline reproducible
    status: passed_feasibility
    passed_date: "2026-10-03"
    notes: >
      Kaggle s2 v3 (commit df0de53a, T4): 10 epochs, batch 16, seed 42 — mAP50 0.488,
      mAP50-95 0.323 (AP50 car 0.720 / bus 0.494 / truck 0.525 / motorcycle 0.215).
      ~13 min/epoch; training loss still decreasing at epoch 10 (not converged).
      Single seed: main-scale G2 (100 epochs, 3 seeds) still open. EXP-2026-10-03-S2v3-G2-centralized.

  G3:
    name: FedAvg baseline reproducible
    status: passed_feasibility
    passed_date: "2026-10-03"
    notes: >
      Kaggle s2 v3: FedAvg S0 IID 5 rounds x 1 local epoch — mAP50 0.377 (−0.111 vs G2);
      FedProx mu=0.01 0.376. ~20 min/round incl. server eval. Not converged at round 5.
      FL saw 5 data passes vs 10 for G2, so the gap mixes FL cost with compute (report §).
      SCAFFOLD blocked (ADR-010), FedNova not run. Single seed.

  G4:
    name: Missing-Class effect established
    status: not_started
    passed_date: null
    notes: >
      Requires S1 vs S1-Control with parameter + prediction evidence.
