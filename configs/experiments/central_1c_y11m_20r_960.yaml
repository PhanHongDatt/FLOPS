# ADR-039: central_1c_y11s_20r_960 (ADR-026) with YOLO11m; batch 8 as convergence_5c_y11m_20r_960 (ADR-030).
# One client holds all 15,000 images, so 20 rounds match the federated budget; same evaluator and eval rounds.
run_class: feasibility
model:
  name: yolo11m
  weights: yolo11m.pt
  image_size: 960
train:
  batch_size: 8
federated:
  num_clients: 1
  num_rounds: 20
  eval_rounds: [10, 20]
  fraction_evaluate: 0.0
notes: >
  Centralized reference for the YOLO11m main configuration (ADR-033), seed 42, approved by the author 2026-11-19.
