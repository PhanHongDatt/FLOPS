# ADR-023 idea 3: convergence_5c_y11s_20r at 960 px (training AND global evaluation; base 640).
# BDD frames are 1280x720: at 640 the median motorcycle side is ~25 px and 30 % are under 16 px (val, measured).
# Every arm compared at 960 uses this file, baselines included (CLAUDE.md §14).
run_class: feasibility
model:
  name: yolo11s
  weights: yolo11s.pt
  image_size: 960
train:
  batch_size: 16
federated:
  num_clients: 5
  num_rounds: 20
  eval_rounds: [10, 20]
  fraction_evaluate: 0.0
notes: >
  Exploratory, seed 42 first; resolution change approved by the author (ADR-023).
