# ADR-026: centralized ceiling = the 5-client 960 px protocol with one client holding all 15,000 images.
# Per round the single client sees the same images and optimizer steps as the five clients together,
# so 20 rounds match the federated budget; same model, batch, image size, evaluator and eval rounds.
run_class: feasibility
model:
  name: yolo11s
  weights: yolo11s.pt
  image_size: 960
train:
  batch_size: 16
federated:
  num_clients: 1
  num_rounds: 20
  eval_rounds: [10, 20]
  fraction_evaluate: 0.0
notes: >
  Upper bound for P4t1 @ s5moto 960 px (S21b), seed 42, approved by the author 2026-11-01.
