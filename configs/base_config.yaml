# Base training configuration
# Source: thesis Chapter 3, §3.3.3 and §3.3.4
# Do NOT change values here without an ADR update.
# Experiment-specific overrides go in configs/experiments/<exp_id>.yaml

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  name: yolov8n
  weights: yolov8n.pt           # pretrained weights
  image_size: 640               # px, square

# ── Target classes ────────────────────────────────────────────────────────────
classes:
  - car
  - bus
  - truck
  - motorcycle

# ── Centralized training ──────────────────────────────────────────────────────
train:
  epochs: 100
  batch_size: 16
  optimizer: SGD
  lr0: 0.01
  conf: 0.25
  iou: 0.70
  device: 0                     # GPU index; "cpu" for CPU-only

  # ── Local-training knobs [ENGINEERING] ──────────────────────────────────
  # Not thesis hyperparameters: these control Ultralytics trainer behaviour that
  # the thesis does not specify. Rationale in src/model/yolo_wrapper.py and
  # research/plan/plan.md §6.5 / §13.
  workers: 2                    # K2: 8/client x 4 Ray actors swamps ~4 vCPU
  warmup_epochs: 0.0            # H3: Ultralytics default 3.0 > local_epochs=1
  close_mosaic: 0               # freeze augmentation schedule across rounds
  client_run_val: false         # H1/H2: no per-epoch val on the GLOBAL val set
  deterministic: true
  nbs: null                     # nominal batch for grad accumulation (low VRAM)

# ── Federated learning ────────────────────────────────────────────────────────
federated:
  num_clients: 4
  num_rounds: 10
  local_epochs: 1
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  algorithms:
    - FedAvg
    - FedProx
    - SCAFFOLD
    - FedNova

  # ── Simulation resources [ENGINEERING] ──────────────────────────────────
  # client_num_gpus: 1.0 serialises clients onto one GPU. 0.25 placed 4 YOLOv8n
  # trainings on one device at once — certain OOM on a 4 GB GPU, borderline on a
  # 16 GB T4/P100 (plan.md §13 K3). Lower it only after measuring real VRAM.
  client_num_cpus: 1
  client_num_gpus: 1.0

  # ── Checkpointing / disk [ENGINEERING] ──────────────────────────────────
  # Per-round global checkpoints make a Kaggle run resumable across the 12 h
  # session cap (K4); pruning client weights keeps /kaggle/working under its
  # 20 GB budget (K5).
  keep_last_checkpoints: 2
  prune_client_weights: true

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  conf: 0.25
  iou: 0.70
  workers: 0      # [ENGINEERING] server-side eval runs in the Ray driver: no forked loaders
  metrics:
    - mAP50
    - mAP50-95
    - precision_per_class
    - recall_per_class
    - AP_per_class
    - FP_per_class
    - FN_per_class

# ── Reproducibility ───────────────────────────────────────────────────────────
reproducibility:
  seeds:
    - 42
    - 123
    - 2024
  min_seeds: 3                  # minimum seeds for main experiments
