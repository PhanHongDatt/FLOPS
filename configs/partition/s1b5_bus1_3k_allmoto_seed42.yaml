partition_id: s1b5_bus1_3k_allmoto_seed42
scenario: S1-Redeal
seed: 42
num_clients: 5
reference_manifest: s1b5_bus_3k_allmoto_seed42/manifest.yaml
absent:
  bus: [C0, C1, C2, C3]
  truck: [C3]
rare_rule_id: pre_registered_rule_v1
rare_threshold: 50
