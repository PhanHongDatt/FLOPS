# Kaggle sessions run headless with `python scripts/kaggle_run.py <session> push`.
# Each session = one notebook from notebooks/, pinned to the pushed git commit,
# run on Kaggle with GPU + internet. See docs/KAGGLE_SETUP.md §2b.
#
# kernel_sources: earlier sessions whose OUTPUT is mounted under /kaggle/input/<slug>/
# (e.g. s3 finds the G2 checkpoint from s2). replace: exact-text overrides applied
# to the notebook before pushing; each must match exactly once.
owner: phdatt
repo_url: https://github.com/PhanHongDatt/FLOPS.git
dataset_sources: [phdatt/bdd100k-flops]
machine_shape: NvidiaTeslaT4          # GPU T4 x2

sessions:
  s1:   # G1 environment, F1 on the pinned stack, fp32 check (ADR-008), smoke FL
    slug: flops-s1-smoke-g1
    notebook: notebooks/01_smoke_G1_G3.py

  s2:   # G2 centralized (produces the G2 checkpoint) + G3 FedAvg S0
    slug: flops-s2-baseline-g2-g3
    notebook: notebooks/02_baseline_G2_G3.py

  s3:   # F2 + F3 from the s2 G2 checkpoint; C1 skipped
    slug: flops-s3-f2-f3
    notebook: notebooks/03_missing_class_G4.py
    kernel_sources: [s2]
    replace:
      "RUN_C1 = True": "RUN_C1 = False"

  s4a:  # C1 seed 42 (S1b vs matched control). F2/F3 cells skip: no G2 source attached
    slug: flops-s4a-c1-seed42
    notebook: notebooks/03_missing_class_G4.py
    replace:
      "SEEDS = [42, 123, 2024]  # from base_config.yaml": "SEEDS = [42]"

  s4b:  # C1 seeds 123, 2024
    slug: flops-s4b-c1-seed123-2024
    notebook: notebooks/03_missing_class_G4.py
    replace:
      "SEEDS = [42, 123, 2024]  # from base_config.yaml": "SEEDS = [123, 2024]"

  s5a:  # S1b-2k, 30 rounds: baselines + server-side method (ADR-011). ~8 h
    slug: flops-s5a-s1b-baselines
    notebook: notebooks/05_convergence_s1b.py
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["A0", "FedProx", "A1", "A3"]'

  s5b:  # S1b-2k, 30 rounds: client-side + full method + H1 control (ADR-011). ~6 h
    slug: flops-s5b-s1b-method
    notebook: notebooks/05_convergence_s1b.py
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["A2b", "A4b", "A0@control"]'

  s6a:  # extra seed 123 for H1 + full method (A0, A0@control, A4b), same partition/protocol as s5
    slug: flops-s6a-seed123
    notebook: notebooks/05_convergence_s1b.py
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["A0", "A0@control", "A4b"]'
      'SEED = 42   # training seed; the partition is the same for every seed (CLAUDE.md §14)': 'SEED = 123'

  s6b:  # extra seed 2024 (same arms)
    slug: flops-s6b-seed2024
    notebook: notebooks/05_convergence_s1b.py
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["A0", "A0@control", "A4b"]'
      'SEED = 42   # training seed; the partition is the same for every seed (CLAUDE.md §14)': 'SEED = 2024'

  s7a:  # diagnostics (ADR-014): D1 error decomposition of s5/s6 checkpoints, D3 = A0 on the pooled
        # re-split, plus A6c (focal control for A6). Seed 42, same protocol as s5. ~4 h
    slug: flops-s7a-diagnostics
    notebook: notebooks/05_convergence_s1b.py
    kernel_sources: [s5a, s5b, s6a, s6b]
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["A0@pooled", "A6c"]'
      'RUN_D1 = False   # session s7a sets True': 'RUN_D1 = True'

  s7b:  # new directions (ADR-012, ADR-013): A5 not-true distillation, A6 Equalized Focal Loss. ~4 h
    slug: flops-s7b-directions
    notebook: notebooks/05_convergence_s1b.py
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["A5", "A6"]'

  s8t:  # ADR-015: draw the server's 1,000-image sample and train the teacher T (50 epochs). ~45 min
    slug: flops-s8t-teacher
    notebook: notebooks/05_convergence_s1b.py
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = []'
      'RUN_TEACHER = False   # session s8t sets True': 'RUN_TEACHER = True'

  s8a:  # ADR-015: B1 (FedAvg from T), B2 (+ server fine-tune on the sample). Needs s8t. ~4 h
    slug: flops-s8a-server-baselines
    notebook: notebooks/05_convergence_s1b.py
    kernel_sources: [s8t]
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["B1", "B2"]'

  s8b:  # ADR-015: P1 (KD from fixed T), P2 (P1 + rho 0.25). Needs s8t. ~4 h
    slug: flops-s8b-teacher-kd
    notebook: notebooks/05_convergence_s1b.py
    kernel_sources: [s8t]
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["P1", "P2"]'

  s8c:  # ADR-015: B2 re-run after s8a's B2 crashed in round 2 (server reused one YOLO object). ~2.5 h
    slug: flops-s8c-b2-rerun
    notebook: notebooks/05_convergence_s1b.py
    kernel_sources: [s8t]
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["B2"]'

  # ── Sessions on other accounts (phdatt's weekly GPU quota ran out 2026-10-05). They use the
  # public mirror solesensei/solesensei_bdd100k (same images, box-identical labels for the four
  # classes) and the s8t teacher uploaded as <owner>/flops-teacher-s8t (sha256 0aa06f52…).
  # Push with that account's token in KAGGLE_API_TOKEN; tokens are never stored in the repo.

  s8c_g:  # B2 re-run (seed 42) on goshihayashi. ~2.5 h
    slug: flops-s8c-b2-rerun
    owner: goshihayashi
    notebook: notebooks/05_convergence_s1b.py
    dataset_sources: [solesensei/solesensei_bdd100k, goshihayashi/flops-teacher-s8t]
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["B2"]'

  s9a_x:  # seed 123 for B1 and P1 on alexnguyen273. ~4 h
    slug: flops-s9a-seed123-b1-p1
    owner: alexnguyen273
    notebook: notebooks/05_convergence_s1b.py
    dataset_sources: [solesensei/solesensei_bdd100k, alexnguyen273/flops-teacher-s8t]
    replace:
      'ARMS = ["A0", "FedProx", "A1", "A3", "A2b", "A4b", "A0@control"]   # sessions override this': 'ARMS = ["B1", "P1"]'
      'SEED = 42   # training seed; the partition is the same for every seed (CLAUDE.md §14)': 'SEED = 123'
